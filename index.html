<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD - Academico - Python</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">::.. SISTEMA ACADEMICO ..::</a>
      <div class="collapse navbar-collapse" id="mnxAcademica">
        <div class="navbar-nav">

        </div>
      </div>
  </nav>
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="row w-100">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h3>Conversor Celsius a Fahrenheit (IA)</h3>
          </div>
          <div class="card-body">
            <form id="frmConversorCelsiusToFahrenheit">
              <div class="mb-3">
                <label for="txtGradosCelsius" class="form-label">Celsius</label>
                <input type="number" step="any" class="form-control" id="txtGradosCelsius" required>
              </div>
              <div class="mb-3">
                <h3><span id="lblGradosFahrenheit" class="badge text-bg-light">Fahrenheit: 0</span></h3>
              </div>
              <button type="submit" class="btn btn-primary">Convertir</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h3>Conversor Fahrenheit a Celsius</h3>
          </div>
          <div class="card-body">
            <form id="frmConversorFahrenheitToCelsius">
              <div class="mb-3">
                <label for="txtGradosFahrenheit" class="form-label">Fahrenheit</label>
                <input type="number" step="any" class="form-control" id="txtGradosFahrenheit" required>
              </div>
              <div class="mb-3">
                <h3><span id="lblGradosCelsius" class="badge text-bg-light">Celsius: 0</span></h3>
              </div>
              <button type="submit" class="btn btn-primary">Convertir</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.1/jquery-ui.min.js"
    integrity="sha512-MSOo1aY+3pXCOCdGAYoBZ6YGI0aragoQsg1mKKBHXCYPIWxamwOE7Drh+N5CPgGI5SA9IEKJiPjdfqWFWmZtRA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", event => {

      // 1. Lógica para Celsius a Fahrenheit
      const frmCtoF = document.getElementById('frmConversorCelsiusToFahrenheit');
      frmCtoF.addEventListener('submit', async e => {
        e.preventDefault();
        let datos = {
          celsius: document.getElementById('txtGradosCelsius').value
        };

        // Fetch al endpoint específico
        let respuesta = await fetch('http://localhost:3000/celsiusToFahrenheit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });
        let resp = await respuesta.json();
        document.getElementById('lblGradosFahrenheit').innerHTML = `Fahrenheit: ${resp.grados}`;
      });

      // 2. Lógica para Fahrenheit a Celsius
      const frmFtoC = document.getElementById('frmConversorFahrenheitToCelsius');
      frmFtoC.addEventListener('submit', async e => {
        e.preventDefault();
        let datos = {
          fahrenheit: document.getElementById('txtGradosFahrenheit').value
        };

        // Fetch al endpoint específico
        let respuesta = await fetch('http://localhost:3000/fahrenheitToCelsius', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });
        let resp = await respuesta.json();
        document.getElementById('lblGradosCelsius').innerHTML = `Celsius: ${resp.grados}`;
      });

    });
  </script>
</body>

</html>Ñ
