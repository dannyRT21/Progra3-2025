<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Academico - Python</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css"/>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-md-6">
                <form id="frmAlumnos">
                    <div class="card text-bg-dark">
                        <div class="card-header">ADMINISTRACION DE ALUMNOS</div>
                        <div class="card-body">
                            <div class="row p-1">
                                <div class="col-3 col-md-2">CODIGO</div>
                                <div class="col-9 col-md-3">
                                    <input required type="text" id="txtCodigoAlumno" name="txtCodigoAlumno" class="form-control form-control-sm" />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-3 col-md-2">NOMBRE</div>
                                <div class="col-9 col-md-4">
                                    <input required type="text" id="txtNombreAlumno" name="txtNombreAlumno" class="form-control form-control-sm" />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-3 col-md-2">DIRECCION</div>
                                <div class="col-9 col-md-8">
                                    <input required type="text" id="txtDireccionAlumno" name="txtDireccionAlumno" class="form-control form-control-sm" />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-3 col-md-2">TELEFONO</div>
                                <div class="col-9 col-md-3">
                                    <input type="text" id="txtTelefonoAlumno" name="txtTelefonoAlumno" class="form-control form-control-sm" />
                                </div>
                            </div>
                            <div class="row p-1">
                                <div class="col-3 col-md-2">EMAIL</div>
                                <div class="col-9 col-md-4">
                                    <input type="email" id="txtEmailAlumno" name="txtEmailAlumno" class="form-control form-control-sm" />
                                </div>
                            </div>
                        </div>
                        <div class="card-footer text-center">
                            <input type="submit" id="btnGuardarAlumno" name="btnGuardarAlumno" class="btn btn-primary" value="GUARDAR" />
                            <input type="reset" id="btnNuevoAlumno" name="btnNuevoAlumno" class="btn btn-warning" value="NUEVO" />
                        </div>
                    </div>
                </form>  
            </div>
            <div class="col-12 col-md-6">
                <form id="frmBusquedaAlumnos">
                    <div class="card text-bg-dark">
                        <div class="card-header">BUSQUEDA DE ALUMNOS</div>
                        <div class="card-body">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>CODIGO</th>
                                        <th>NOMBRE</th>
                                        <th>DIRECCION</th>
                                        <th>TELEFONO</th>
                                        <th>EMAIL</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="tblAlumnos"></tbody>
                            </table>
                        </div>
                    </div>
                </form>  
            </div>
        </div>
    </div>
    <div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12 col-md-6">

            <form id="frmDocentes">
                <div class="card text-bg-dark">
                    <div class="card-header">ADMINISTRACION DE DOCENTES</div>
                    <div class="card-body">
                        <div class="row p-1">
                            <div class="col-3 col-md-2">CODIGO</div>
                            <div class="col-9 col-md-3">
                                <input required type="text" id="txtCodigoDocente" name="txtCodigoDocente" class="form-control form-control-sm" />
                            </div>
                        </div>
                        <div class="row p-1">
                            <div class="col-3 col-md-2">NOMBRE</div>
                            <div class="col-9 col-md-4">
                                <input required type="text" id="txtNombreDocente" name="txtNombreDocente" class="form-control form-control-sm" />
                            </div>
                        </div>
                        <div class="row p-1">
                            <div class="col-3 col-md-2">DIRECCION</div>
                            <div class="col-9 col-md-8">
                                <input required type="text" id="txtDireccionDocente" name="txtDireccionDocente" class="form-control form-control-sm" />
                            </div>
                        </div>
                        <div class="row p-1">
                            <div class="col-3 col-md-2">TELEFONO</div>
                            <div class="col-9 col-md-3">
                                <input type="text" id="txtTelefonoDocente" name="txtTelefonoDocente" class="form-control form-control-sm" />
                            </div>
                        </div>
                        <div class="row p-1">
                            <div class="col-3 col-md-2">EMAIL</div>
                            <div class="col-9 col-md-4">
                                <input type="email" id="txtEmailDocente" name="txtEmailDocente" class="form-control form-control-sm" />
                            </div>
                        </div>
                        <div class="row p-1">
                            <div class="col-3 col-md-2">DUI</div>
                            <div class="col-9 col-md-3">
                                <input required type="text" id="txtDuiDocente" name="txtDuiDocente" class="form-control form-control-sm" />
                            </div>
                        </div>
                        <div class="row p-1">
                            <div class="col-3 col-md-2">ESCALAFON</div>
                            <div class="col-9 col-md-3">
                                <input required type="text" id="txtEscalafonDocente" name="txtEscalafonDocente" class="form-control form-control-sm" />
                            </div>

                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <input type="submit" id="btnGuardarDocente" name="btnGuardarDocente" class="btn btn-primary" value="GUARDAR" />
                        <input type="reset" id="btnNuevoDocente" name="btnNuevoDocente" class="btn btn-warning" value="NUEVO" />
                    </div>
                </div>
            </form>  
        </div>
        <div class="col-12 col-md-6">
            <form id="frmBusquedaDocentes">
                <div class="card text-bg-dark">
                    <div class="card-header">BUSQUEDA DE DOCENTES</div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>CODIGO</th>
                                    <th>NOMBRE</th>
                                    <th>DIRECCION</th>
                                    <th>TELEFONO</th>
                                    <th>EMAIL</th>
                                    <th>DUI</th>
                                    <th>ESCALAFON</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tblDocentes"></tbody>
                        </table>
                    </div>
                </div>
            </form>  
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script>
    // ===== ESTADO (Alumnos) =====
    var accion = "nuevo",
        idAlumno = 0;

    // ===== ESTADO (Docentes) =====
    var accionDocente = "nuevo",
        idDocente = 0;

    document.addEventListener("DOMContentLoaded", event => {
        // ===== FORM ALUMNOS =====
        frmAlumnos.addEventListener("submit", e => {
            e.preventDefault();
            guardarAlumnos();
        });

        btnNuevoAlumno.addEventListener("click", e => {
            limpiarFormulario();
        });

        obtenerAlumnos();

        // ===== FORM DOCENTES =====
        frmDocentes.addEventListener("submit", e => {
            e.preventDefault();
            guardarDocentes();
        });

        btnNuevoDocente.addEventListener("click", () => {
            limpiarFormularioDocentes();
        });

        obtenerDocentes();
    });

    // ===========================
    // ALUMNOS
    // ===========================
    async function guardarAlumnos() {
        let accionActual = accion;

        let datos = {
            accion,
            idAlumno,
            codigo: txtCodigoAlumno.value,
            nombre: txtNombreAlumno.value,
            direccion: txtDireccionAlumno.value,
            telefono: txtTelefonoAlumno.value,
            email: txtEmailAlumno.value
        };

        let response = await fetch("/alumnos", {
            method: "POST",
            body: JSON.stringify(datos),
        }),
            respuesta = await response.json();

        if (respuesta.msg != "ok") {
            alertify.error(`Error al procesar alumno: ${respuesta}`);
            return;
        }

        if (accionActual === "nuevo") {
            alertify.success('✔️ Alumno **agregado** con éxito.');
        } else if (accionActual === "modificar") {
            alertify.success('✏️ Alumno **modificado** con éxito.');
        } else if (accionActual === "eliminar") {
            alertify.success('🗑️ Alumno **eliminado** con éxito.');
        }

        limpiarFormulario();
        obtenerAlumnos();
    }

    function limpiarFormulario() {
        accion = "nuevo";
        idAlumno = 0;
        txtCodigoAlumno.value = "";
        txtNombreAlumno.value = "";
        txtDireccionAlumno.value = "";
        txtTelefonoAlumno.value = "";
        txtEmailAlumno.value = "";
    }

    async function obtenerAlumnos() {
        let response = await fetch("/alumnos"),
            respuesta = await response.json();
        mostrarDatosAlumnos(respuesta);
    }

    function mostrarDatosAlumnos(alumnos) {
        let filas = "";
        alumnos.forEach(alumno => {
            filas += `
                <tr onClick='mostrarAlumno(${JSON.stringify(alumno)})'>
                    <td>${alumno.codigo}</td>
                    <td>${alumno.nombre}</td>
                    <td>${alumno.direccion}</td>
                    <td>${alumno.telefono}</td>
                    <td>${alumno.email}</td>
                    <td><button type="button" onClick='eliminarAlumno(${JSON.stringify(alumno)})' class="btn btn-danger btn-sm">ELIMINAR</button></td>
                </tr>
            `;
        });
        tblAlumnos.innerHTML = filas;
    }

    function mostrarAlumno(alumno) {
        accion = "modificar";
        idAlumno = alumno.idAlumno;
        txtCodigoAlumno.value = alumno.codigo;
        txtNombreAlumno.value = alumno.nombre;
        txtDireccionAlumno.value = alumno.direccion;
        txtTelefonoAlumno.value = alumno.telefono;
        txtEmailAlumno.value = alumno.email;
    }

    function eliminarAlumno(alumno) {
        alertify.confirm(
            'Eliminar Alumno',
            `¿Está seguro de **eliminar** a ${alumno.nombre} **(${alumno.codigo})**?`,
            function () {
                idAlumno = alumno.idAlumno;
                accion = "eliminar";
                guardarAlumnos();
            },
            function () {
                alertify.error('Cancelado');
            }
        ).set('labels', { ok: 'Sí, Eliminar', cancel: 'Cancelar' }).set('movable', false);
    }

    // ===========================
    // DOCENTES
    // ===========================
    async function guardarDocentes() {
        const accionActual = accionDocente;

        const datos = {
            accion: accionDocente,
            idDocente,
            codigo: txtCodigoDocente.value,
            nombre: txtNombreDocente.value,
            direccion: txtDireccionDocente.value,
            telefono: txtTelefonoDocente.value,
            email: txtEmailDocente.value,
            dui: txtDuiDocente.value,
            escalafon: txtEscalafonDocente.value
        };

        const response = await fetch("/docentes", {
            method: "POST",
            body: JSON.stringify(datos),
        });
        const respuesta = await response.json();

        if (respuesta.msg !== "ok") {
            alertify.error(`Error al procesar docente: ${respuesta}`);
            return;
        }

        if (accionActual === "nuevo") {
            alertify.success('✔️ Docente agregado con éxito.');
        } else if (accionActual === "modificar") {
            alertify.success('✏️ Docente modificado con éxito.');
        } else if (accionActual === "eliminar") {
            alertify.success('🗑️ Docente eliminado con éxito.');
        }

        limpiarFormularioDocentes();
        obtenerDocentes();
    }

    function limpiarFormularioDocentes() {
        accionDocente = "nuevo";
        idDocente = 0;
        txtCodigoDocente.value = "";
        txtNombreDocente.value = "";
        txtDireccionDocente.value = "";
        txtTelefonoDocente.value = "";
        txtEmailDocente.value = "";
        txtDuiDocente.value = "";
        txtEscalafonDocente.value = "";
    }

    async function obtenerDocentes() {
        const response = await fetch("/docentes");
        const respuesta = await response.json();
        mostrarDatosDocentes(respuesta);
    }

    function mostrarDatosDocentes(docentes) {
        let filas = "";
        docentes.forEach(doc => {
            filas += `
                <tr onClick='mostrarDocente(${JSON.stringify(doc)})'>
                    <td>${doc.codigo}</td>
                    <td>${doc.nombre}</td>
                    <td>${doc.direccion ?? ""}</td>
                    <td>${doc.telefono ?? ""}</td>
                    <td>${doc.email ?? ""}</td>
                    <td>${doc.dui}</td>
                    <td>${doc.escalafon}</td>
                    <td>
                        <button type="button" onClick='eliminarDocente(${JSON.stringify(doc)})' class="btn btn-danger btn-sm">ELIMINAR</button>
                    </td>
                </tr>
            `;
        });
        tblDocentes.innerHTML = filas;
    }

    function mostrarDocente(doc) {
        accionDocente = "modificar";
        idDocente = doc.idDocente;
        txtCodigoDocente.value = doc.codigo ?? "";
        txtNombreDocente.value = doc.nombre ?? "";
        txtDireccionDocente.value = doc.direccion ?? "";
        txtTelefonoDocente.value = doc.telefono ?? "";
        txtEmailDocente.value = doc.email ?? "";
        txtDuiDocente.value = doc.dui ?? "";
        txtEscalafonDocente.value = doc.escalafon ?? "";
    }

    function eliminarDocente(doc) {
        alertify.confirm(
            'Eliminar Docente',
            `¿Está seguro de eliminar a ${doc.nombre} (${doc.codigo})?`,
            function () {
                idDocente = doc.idDocente;
                accionDocente = "eliminar";
                guardarDocentes();
            },
            function () {
                alertify.error('Cancelado');
            }
        ).set('labels', { ok: 'Sí, Eliminar', cancel: 'Cancelar' }).set('movable', false);
    }
</script>
</body>
</html>
