<form id="frmBusquedaMaterias">
  <div class="card text-bg-dark">
    <div class="card-header">
      <div class="d-flex">
        BUSQUEDA DE MATERIAS
        <div class="ms-auto">
          <button data-form="busqueda_materias" type="button" class="btn-close btn-close-white" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <div class="card-body">
      <table class="table table-hover table-dark table-striped text-white">
        <thead>
          <tr>
            <th>CODIGO</th>
            <th>MATERIA</th>
            <th>DOCENTE</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tblMaterias"></tbody>
      </table>
    </div>
  </div>
</form>

<script>
  obtenerMaterias();

  async function obtenerMaterias(){
    try{
      const response = await fetch("/materias");
      if (!response.ok) {
        let msg = `HTTP ${response.status}`;
        try{
          const j = await response.json();
          if (j && j.msg) msg = j.msg;
        }catch(_){}
        if (typeof alertify !== "undefined") alertify.error(`Error al cargar materias: ${msg}`);
        tblMaterias.innerHTML = "";
        return;
      }
      const data = await response.json();
      if (!Array.isArray(data)) {
        console.warn('Formato inesperado en /materias:', data);
        if (typeof alertify !== "undefined") alertify.error("Formato inesperado en /materias");
        tblMaterias.innerHTML = "";
        return;
      }
      mostrarDatosMaterias(data);
    }catch(err){
      console.error(err);
      if (typeof alertify !== "undefined") alertify.error("No se pudieron cargar las materias.");
      tblMaterias.innerHTML = "";
    }
  }

  function mostrarDatosMaterias(materias){
    let filas = "";
    materias.forEach(mat=>{
      const codigo = mat.codigo ?? "";
      const nombreMateria = mat.nombre ?? mat.nombre_materia ?? "";
      const nombreDocente = mat.nombre_docente ?? mat.docenteNombre ?? "";
      filas += `
        <tr onClick='mostrarMateria(${ JSON.stringify(mat) })'>
          <td>${codigo}</td>
          <td>${nombreMateria}</td>
          <td>${nombreDocente}</td>
          <td>
            <button type="button"
                    onClick='eliminarMateria(${ JSON.stringify(mat) }, event)'
                    class="btn btn-outline-danger btn-sm">
              ELIMINAR
            </button>
          </td>
        </tr>
      `;
    });
    tblMaterias.innerHTML = filas;
  }

  async function eliminarMateria(materia, event){
    event.preventDefault();
    event.stopPropagation(); // evita que se dispare mostrarMateria() del <tr>

    const nombreMateria = materia.nombre ?? materia.nombre_materia ?? "la materia";
    if (!confirm(`¿Está seguro de eliminar "${nombreMateria}"?`)) return;

    // Setea estado global para que guardarMaterias() haga POST de eliminación
    accionMateria = "eliminar";
    idMateria = materia.idMateria ?? materia.id ?? 0;

    // Llama al flujo central (maneja fetch/errores)
    const result = await guardarMaterias();
    if (result === false) return;

    // Refresca la tabla
    obtenerMaterias();
  }
</script>
