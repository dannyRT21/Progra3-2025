<!-- busqueda_notas.html -->
<form id="frmBusquedaNotas">
  <div class="card text-bg-dark">
    <div class="card-header">
      <div class="d-flex">
        BUSQUEDA DE NOTAS
        <div class="ms-auto">
          <button data-form="busqueda_notas" type="button" class="btn-close btn-close-white" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <div class="card-body">
      <table class="table table-hover table-dark table-striped text-white">
        <thead>
          <tr>
            <th>ALUMNO</th>
            <th>MATERIA</th>
            <th>NOTA</th>
            <th>APROBADO</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tblNotas"></tbody>
      </table>
    </div>
  </div>
</form>

<script>
  obtenerNotas();

  async function obtenerNotas(){
    try{
      const response = await fetch("/notas");
      if (!response.ok) {
        let msg = `HTTP ${response.status}`;
        try{
          const j = await response.json();
          if (j && j.msg) msg = j.msg;
        }catch(_){}
        if (typeof alertify !== "undefined") alertify.error(`Error al cargar notas: ${msg}`);
        tblNotas.innerHTML = "";
        return;
      }
      const data = await response.json();
      if (!Array.isArray(data)) {
        console.warn('Formato inesperado en /notas:', data);
        if (typeof alertify !== "undefined") alertify.error("Formato inesperado en /notas");
        tblNotas.innerHTML = "";
        return;
      }
      mostrarDatosNotas(data);
    }catch(err){
      console.error(err);
      if (typeof alertify !== "undefined") alertify.error("No se pudieron cargar las notas.");
      tblNotas.innerHTML = "";
    }
  }

  function mostrarDatosNotas(notas){
    let filas = "";
    notas.forEach(n=>{
      const alumno = n.nombre_alumno ?? n.alumnoNombre ?? "";
      const materia = n.nombre_materia ?? n.materiaNombre ?? "";
      const valor = (typeof n.nota !== "undefined" && n.nota !== null) ? n.nota : "";
      const aprobado = n.aprobado ?? "";
      filas += `
        <tr onClick='mostrarNota(${ JSON.stringify(n) })'>
          <td>${alumno}</td>
          <td>${materia}</td>
          <td>${valor}</td>
          <td>${aprobado}</td>
          <td>
            <button type="button"
                    onClick='eliminarNota(${ JSON.stringify(n) }, event)'
                    class="btn btn-outline-danger btn-sm">
              ELIMINAR
            </button>
          </td>
        </tr>
      `;
    });
    tblNotas.innerHTML = filas;
  }

  async function eliminarNota(nota, event){
    event.preventDefault();
    event.stopPropagation(); // evita mostrarNota() del <tr>

    const alumno = nota.nombre_alumno ?? "el alumno";
    const materia = nota.nombre_materia ?? "la materia";
    if (!confirm(`¿Eliminar la nota de "${alumno}" en "${materia}"?`)) return;

    // Estado global para que guardarNotas() haga POST de eliminación
    accionNota = "eliminar";
    idNota = nota.idNota ?? nota.id ?? 0;

    const result = await guardarNotas();
    if (result === false) return;

    obtenerNotas();
  }
</script>
