<form id="frmMaterias">
  <div class="card text-bg-dark" style="min-width: 700px;">
    <div class="card-header">
      <div class="d-flex">
        ADMINISTRACION DE MATERIAS
        <div class="ms-auto">
          <button data-form="materias" type="button" class="btn-close btn-close-white" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <div class="card-body">
      <div class="row p-1">
        <div class="col-3 col-md-2">CODIGO</div>
        <div class="col-9 col-md-3">
          <input required type="text" id="txtCodigoMateria" name="txtCodigoMateria" class="form-control form-control-sm" />
        </div>
      </div>

      <div class="row p-1">
        <div class="col-3 col-md-2">NOMBRE</div>
        <div class="col-9 col-md-5">
          <input required type="text" id="txtNombreMateria" name="txtNombreMateria" class="form-control form-control-sm" />
        </div>
      </div>

      <div class="row p-1">
        <div class="col-3 col-md-2">DOCENTE</div>
        <div class="col-9 col-md-6">
          <select required id="cmbDocente" name="cmbDocente" class="form-control form-control-sm">
            <option value="">-- Seleccione un docente --</option>
            <!-- Se llena dinámicamente con JS -->
          </select>
        </div>
      </div>
    </div>

    <div class="card-footer text-center">
      <input type="submit" id="btnGuardarMateria" name="btnGuardarMateria" class="btn btn-outline-primary" value="GUARDAR" />
      <input type="reset" id="btnNuevoMateria" name="btnNuevoMateria" class="btn btn-outline-warning" value="NUEVO" />
      <input type="button" id="btnBuscarMateria" name="btnBuscarMateria" class="btn btn-outline-info" value="BUSCAR" />
    </div>
  </div>
</form>

<script>
  // --- Estado global de Materias (igual a docentes) ---
  var accionMateria = "nuevo",
      idMateria = 0;

  // Enlazar eventos del formulario
  frmMaterias.addEventListener("submit", (e) => {
    e.preventDefault();
    guardarMaterias();
  });

  btnBuscarMateria.addEventListener("click", (e) => {
    e.preventDefault();
    // Abre la vista flotante de búsqueda
    if (typeof abrirVentana === "function") {
      abrirVentana('busqueda_materias');
    }
  });

  // Limitar longitud de código (como en docentes)
  txtCodigoMateria.addEventListener("input", (e) => {
    e.target.value = (e.target.value || "").slice(0, 10);
  });

  // Cargar combo de docentes al abrir la vista
  (async function initMateriasView(){
    await cargarDocentesCombo();
  })();

  async function cargarDocentesCombo(){
    try{
      const resp = await fetch("/docentes");
      const lista = await resp.json();

      // preservar selección si re-cargas
      const selPrevio = cmbDocente.value || "";
      let opts = `<option value="">-- Seleccione un docente --</option>`;
      lista.forEach(d=>{
        // soporta llaves con diferentes nombres por si backend cambia
        const id = d.idDocente ?? d.id ?? "";
        const nombre = d.nombre ?? d.nombre_docente ?? "";
        opts += `<option value="${id}">${nombre}</option>`;
      });
      cmbDocente.innerHTML = opts;
      if (selPrevio) cmbDocente.value = selPrevio;
    }catch(err){
      console.error(err);
      if (typeof alertify !== "undefined") alertify.error("No se pudieron cargar los docentes.");
    }
  }

  // ------ CRUD ------
  async function guardarMaterias(){
    // congela acción
    const accionLocal = accionMateria;

    // para eliminar solo se usa id
    if (accionLocal === "eliminar"){
      const payload = { accion: "eliminar", idMateria };
      const ok = await postMateria(payload);
      if (ok){
        limpiarFormularioMaterias();
        // si existe función global de refresco (tabla búsqueda)
        if (typeof obtenerMaterias === "function") obtenerMaterias();
        accionMateria = "nuevo";
      }
      return ok;
    }

    // validar crear/modificar
    const res = validarYNormalizarMateria();
    if (!res.ok){
      if (typeof alertify !== "undefined") alertify.error(res.msg);
      return false;
    }

    const v = res.values;
    const payload = {
      accion: accionLocal,  // "nuevo" | "modificar"
      idMateria,
      codigo: v.codigo,
      nombre: v.nombre,
      idDocente: v.idDocente
    };

    const ok = await postMateria(payload);
    if (ok){
      limpiarFormularioMaterias();
      if (typeof obtenerMaterias === "function") obtenerMaterias();
      accionMateria = "nuevo";
    }
    return ok;
  }

  async function postMateria(data){
    try{
      const response = await fetch("/materias",{
        method: "POST",
        body: JSON.stringify(data),
      });
      const r = await response.json();
      if (r.msg !== "ok"){
        if (typeof alertify !== "undefined") alertify.error(`Error al procesar materia: ${JSON.stringify(r)}`);
        return false;
      }
      if (typeof alertify !== "undefined") {
        const accionTxt = data.accion === "eliminar" ? "Eliminada" : (data.accion === "modificar" ? "Actualizada" : "Guardada");
        alertify.success(`Materia ${accionTxt} correctamente`);
      }
      return true;
    }catch(err){
      console.error(err);
      if (typeof alertify !== "undefined") alertify.error("Error de comunicación con el servidor.");
      return false;
    }
  }

  function validarYNormalizarMateria(){
    let codigo = (txtCodigoMateria.value || "").trim();
    let nombre = (txtNombreMateria.value || "").trim();
    let idDocenteSel = (cmbDocente.value || "").trim();

    if (codigo.length === 0){
      return { ok:false, msg: "El CÓDIGO es requerido." };
    }
    if (codigo.length > 10){
      return { ok:false, msg: "El CÓDIGO debe tener como máximo 10 caracteres." };
    }
    if (nombre.length === 0){
      return { ok:false, msg: "El NOMBRE es requerido." };
    }
    if (!idDocenteSel){
      return { ok:false, msg: "Debe seleccionar un DOCENTE." };
    }

    // espejo (por si hubo trim o recorte)
    txtCodigoMateria.value = codigo;
    txtNombreMateria.value = nombre;
    cmbDocente.value = idDocenteSel;

    return {
      ok: true,
      values: {
        codigo,
        nombre,
        idDocente: Number(idDocenteSel)
      }
    };
  }

  function limpiarFormularioMaterias(){
    accionMateria = "nuevo";
    idMateria = 0;
    txtCodigoMateria.value = "";
    txtNombreMateria.value = "";
    cmbDocente.value = "";
  }

  // Cargar datos desde la tabla de búsqueda
  function mostrarMateria(materia){
    // soportar distintos nombres de campos (alias del SQL)
    accionMateria = "modificar";
    idMateria = materia.idMateria ?? materia.id ?? 0;
    const codigo = materia.codigo ?? "";
    const nombre = materia.nombre ?? materia.nombre_materia ?? "";
    const idDoc = materia.idDocente ?? materia.id_docente ?? "";

    txtCodigoMateria.value = codigo;
    txtNombreMateria.value = nombre;
    // re-cargar combo si hiciera falta antes de setear
    if (!cmbDocente.options.length){
      cargarDocentesCombo().then(()=>{ cmbDocente.value = idDoc; });
    }else{
      cmbDocente.value = idDoc;
    }
    if (typeof alertify !== "undefined") alertify.success(`Materia "${nombre}" cargada para editar`);
  }
</script>
