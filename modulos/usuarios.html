<form id="frmUsuarios">
  <div class="card text-bg-dark" style="min-width: 700px;">
    <div class="card-header">
      <div class="d-flex">
        ADMINISTRACIÓN DE USUARIOS
        <div class="ms-auto">
          <button data-form="usuarios" type="button" class="btn-close btn-close-white" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <div class="card-body">
      <div class="row p-1">
        <div class="col-3 col-md-2">USUARIO</div>
        <div class="col-9 col-md-3">
          <input required type="text" id="txtUsuario" name="txtUsuario" class="form-control form-control-sm" />
        </div>
      </div>

      <div class="row p-1">
        <div class="col-3 col-md-2">CLAVE</div>
        <div class="col-9 col-md-3">
          <input required type="password" id="txtClave" name="txtClave" class="form-control form-control-sm" />
        </div>
      </div>

      <div class="row p-1">
        <div class="col-3 col-md-2">NOMBRE</div>
        <div class="col-9 col-md-4">
          <input required type="text" id="txtNombreUsuario" name="txtNombreUsuario" class="form-control form-control-sm" />
        </div>
      </div>

      <div class="row p-1">
        <div class="col-3 col-md-2">DIRECCIÓN</div>
        <div class="col-9 col-md-8">
          <input type="text" id="txtDireccionUsuario" name="txtDireccionUsuario" class="form-control form-control-sm" />
        </div>
      </div>

      <div class="row p-1">
        <div class="col-3 col-md-2">TELÉFONO</div>
        <div class="col-9 col-md-3">
          <input type="text" id="txtTelefonoUsuario" name="txtTelefonoUsuario" class="form-control form-control-sm" />
        </div>
      </div>
    </div>

    <div class="card-footer text-center">
      <input type="submit" id="btnGuardarUsuario" name="btnGuardarUsuario" class="btn btn-outline-primary" value="GUARDAR" />
      <input type="reset"  id="btnNuevoUsuario"   name="btnNuevoUsuario"  class="btn btn-outline-warning" value="NUEVO" />
      <input type="button" id="btnBuscarUsuario"  name="btnBuscarUsuario" class="btn btn-outline-info" value="BUSCAR" />
    </div>
  </div>
</form>

<script>
  // =========================
  // Estado global
  // =========================
  var accionUsuario = "nuevo",
      idUsuario = 0;

  // =========================
  // Eventos del formulario
  // =========================
  frmUsuarios.addEventListener("submit", e=>{
    e.preventDefault();
    guardarUsuarios();
  });

  // Máscara simple de teléfono: 1234-5678
  txtTelefonoUsuario?.addEventListener("input", e=>{
    let d = e.target.value.replace(/\D/g, "").slice(0,8);
    e.target.value = d.length > 4 ? (d.slice(0,4)+"-"+d.slice(4)) : d;
  });

  // Botón BUSCAR: abre la vista de listado
  btnBuscarUsuario.addEventListener("click", e=>{
    e.preventDefault();
    if(typeof abrirVentana === "function"){
      abrirVentana("busqueda_usuarios");
    }
  });

  // =========================
  // CRUD - Orquestador
  // =========================
  async function guardarUsuarios(){
    // Congelar acción actual
    const acc = accionUsuario;

    let datos;
    if(acc === "eliminar"){
      datos = { accion: "eliminar", idUsuario };
    }else{
      // Validación mínima
      const usuario   = (txtUsuario.value || "").trim();
      const clave     = (txtClave.value || "").trim();
      const nombre    = (txtNombreUsuario.value || "").trim();
      const direccion = (txtDireccionUsuario.value || "").trim();
      let telefono    = (txtTelefonoUsuario.value || "").trim();

      if(usuario.length===0){ msgErr("El USUARIO es requerido."); return false; }
      if(nombre.length===0){ msgErr("El NOMBRE es requerido."); return false; }
      if(acc==="nuevo" && clave.length===0){ msgErr("La CLAVE es requerida."); return false; }

      // Normalizar teléfono opcional
      if(telefono){
        let d = telefono.replace(/\D/g,"").slice(0,8);
        if(d.length!==8){ msgErr("El TELÉFONO debe tener 8 dígitos (1234-5678)."); return false; }
        telefono = d.slice(0,4)+"-"+d.slice(4);
        txtTelefonoUsuario.value = telefono;
      }

      datos = { 
        accion: acc,
        idUsuario,
        usuario, clave, nombre, direccion, telefono
      };
    }

    try{
      const response = await fetch("/usuarios",{
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(datos)
      });

      if(!response.ok){
        const t = await response.text();
        msgErr(`Error HTTP ${response.status}: ${t}`);
        return false;
      }
      const r = await response.json();
      if(r.msg !== "ok"){
        msgErr(`Error al procesar usuario: ${r.msg || JSON.stringify(r)}`);
        return false;
      }

      limpiarFormularioUsuarios();
      // Si hay tabla en la vista abierta, refrescar listado
      if(document.getElementById("tblUsuarios")){
        obtenerUsuarios();
      }

      accionUsuario = "nuevo";
      if(acc !== "eliminar") window.alertify?.success?.("Usuario guardado correctamente");
      return true;

    }catch(err){
      msgErr(`Fallo de red o servidor: ${err}`);
      return false;
    }
  }

  // =========================
  // Helpers del formulario
  // =========================
  function limpiarFormularioUsuarios(){
    accionUsuario = "nuevo";
    idUsuario = 0;
    txtUsuario.value = "";
    txtClave.value = "";
    txtNombreUsuario.value = "";
    txtDireccionUsuario.value = "";
    txtTelefonoUsuario.value = "";
  }

  // Invocada desde la tabla en la vista de búsqueda
  function mostrarUsuario(usuario){
    accionUsuario = "modificar";
    idUsuario = usuario.idUsuario;

    txtUsuario.value          = usuario.usuario ?? "";
    txtClave.value            = ""; // no mostramos clave
    txtNombreUsuario.value    = usuario.nombre ?? "";
    txtDireccionUsuario.value = usuario.direccion ?? "";
    txtTelefonoUsuario.value  = usuario.telefono ?? "";

    window.alertify?.success?.(`Usuario ${usuario.nombre} cargado para editar`);
  }

  
async function obtenerUsuarios() {
  try {
    const resp = await fetch("/usuarios");
    const lista = await resp.json();
    mostrarDatosUsuarios(lista);
  } catch (err) {
    console.error(err);
    if (typeof alertify !== "undefined") alertify.error("Error al obtener usuarios.");
  }
}

  function msgErr(m){
    (window.alertify?.error || alert)(m);
  }

  // util global
  window.escapeHtml = function (str){
    if (str === null || str === undefined) return "";
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  };


</script>
